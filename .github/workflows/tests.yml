name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Documentation contracts
        run: npm run test:docs

      - name: Localization and RTL contracts
        run: npm run test:i18n

      - name: Shared FoxDesk behavior contract
        run: npm run test:shared-behavior

      - name: Validate self-hosted parity metadata
        run: npm run test:core-parity
