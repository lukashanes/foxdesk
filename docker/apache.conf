# FoxDesk Apache settings for the container image.
# The application's own .htaccess still applies (AllowOverride All); the
# rules below repeat its access restrictions so they hold even if .htaccess
# is missing or replaced.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/(backups|bin|includes|migrations|storage|uploads)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(config\.php|config\.example\.php|version\.json|\.maintenance)$">
    Require all denied
</FilesMatch>

<FilesMatch "\.(sql|log|sh|env|md)$">
    Require all denied
</FilesMatch>
