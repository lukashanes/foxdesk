; FoxDesk container defaults. Values in ${...} come from environment
; variables with defaults set in the Dockerfile.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_time = 120
max_file_uploads = 20

; config.php sets the application time zone; this is only the fallback.
date.timezone = UTC

session.cookie_httponly = 1
session.use_strict_mode = 1

; OPcache stays timestamp-validated so files written by the in-app updater
; are picked up without restarting the container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
